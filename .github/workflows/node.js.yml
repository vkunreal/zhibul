name: ZHBL Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-cms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '26'

      - name: Enable Yarn
        run: corepack enable

      - name: Install modules
        working-directory: cms
        run: yarn install --immutable

      - name: Lint
        working-directory: cms
        run: yarn lint

      - name: Test
        working-directory: cms
        run: yarn test

      - name: Build
        working-directory: cms
        run: yarn build

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'

      - name: Install modules
        run: npm run frontend:install

      - name: Build
        run: npm run frontend:build
