upstream legacy_upstream {
    server legacy-api:5001;
    keepalive 16;
}

upstream api_upstream {
    server api:5002;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

# ---- API (NestJS + legacy) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.zhbl.by;

    ssl_certificate /etc/ssl/zhbl.crt;
    ssl_certificate_key /etc/ssl/zhbl.key;

    gzip on;
    gzip_types image/svg+xml image/jpeg image/png image/gif;
    gzip_vary on;
    gzip_min_length 1000;

    client_max_body_size 100M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # ---- ещё на старом бэке ----
    location /api/countries {
        proxy_pass http://legacy_upstream;
    }

    # ---- NestJS ----
    location / {
        proxy_pass http://api_upstream;
        client_max_body_size 100M;
    }
}

# ---- Frontend ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zhbl.by www.zhbl.by;

    ssl_certificate /etc/ssl/zhbl.crt;
    ssl_certificate_key /etc/ssl/zhbl.key;

    client_max_body_size 100M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://frontend_upstream;
        client_max_body_size 100M;
    }
}

# ---- HTTP → HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}
