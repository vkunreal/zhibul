# Production stack
# Usage (from repo root):
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d --build

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app]

  legacy-api:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      MYSQL_HOST: "mysql"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      JWT_SECRET: ${JWT_SECRET}
      DOMAIN: ${BACKEND_DOMAIN}
      PORT: 5001
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app]

  api:
    build:
      context: ../../core-api
      target: production
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      PORT: 5002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      LEGACY_API_URL: http://legacy-api:5001
      LEGACY_MYSQL_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      legacy-api:
        condition: service_started
    networks: [app]

  migrate:
    build:
      context: ../../core-api
      target: build
    command: ["yarn", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  frontend:
    build:
      context: ../../frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: "https://api.zhbl.by"
        NEXT_PUBLIC_API_CORE_URL: "https://api.zhbl.by"
        NEXT_PUBLIC_SITE_URL: "https://zhbl.by"
        NEXT_PUBLIC_METRIKA_ID: "54863989"
        NEXT_PUBLIC_GTM_ID: "GTM-THSSBC2"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "https://api.zhbl.by"
      NEXT_PUBLIC_API_CORE_URL: "https://api.zhbl.by"
      API_URL: "http://legacy-api:5001"
      NEXT_PUBLIC_SITE_URL: "https://zhbl.by"
      NEXT_PUBLIC_METRIKA_ID: "54863989"
      NEXT_PUBLIC_GTM_ID: "GTM-THSSBC2"
    depends_on:
      legacy-api:
        condition: service_started
      api:
        condition: service_started
    networks: [app]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ssl/zhbl.crt:/etc/ssl/zhbl.crt:ro
      - ../ssl/zhbl.key:/etc/ssl/zhbl.key:ro
    depends_on:
      legacy-api:
        condition: service_started
      api:
        condition: service_started
      frontend:
        condition: service_started
    networks: [app]

networks:
  app:

volumes:
  mysql-data:
  pg-data:
